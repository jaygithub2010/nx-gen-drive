<div class="container-fluid">
    <h1> Advance Search</h1>
    <div class="row">
        <span class="col-2"> File Type </span>
        <div class="col-10">
            <div class="dropdown">
                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton"
                    data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    {{this.searchOptions.fileType}}
                </button>
                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">All</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Photos and Images</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Word Documents</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Videos</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Audio</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">PDFs</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Spreadsheets</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Presentations</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Code Files</a>
                    <a class="dropdown-item" (click)="onDropdownSelected($event)">Archives</a>
                </div>
            </div>
        </div>
    </div>
</div>
